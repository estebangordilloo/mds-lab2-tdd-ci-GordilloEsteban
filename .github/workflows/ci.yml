name: CI

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Tu proyecto usa JDK 21 (como se ve en la imagen), así que usaremos 21
          java-version: '21' 

      - name: Build and test
        # El comando para ejecutar las pruebas con Maven
        run: mvn -B test